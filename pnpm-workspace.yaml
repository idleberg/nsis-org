packages:
  - "packages/*"
  - "web"

allowBuilds:
  esbuild: false
  lefthook: false
  sharp: false

autoInstallPeers: true
injectWorkspacePackages: true
publicHoistPattern:
  - "*@biomejs/biome*"
  - "*@e18e/cli*"
  - "*@total-typescript/tsconfig*"

minimumReleaseAgeExclude:
  - "@nsis/dent"
  - "@idleberg/configs"
  - tree-sitter-nsis

catalog:
  "@codemirror/autocomplete": ^6.20.3
  "@codemirror/commands": ^6.11.0
  "@codemirror/language": ^6.12.4
  "@codemirror/state": ^6.7.1
  "@codemirror/theme-one-dark": ^6.1.3
  "@codemirror/view": ^6.43.9
  "@idleberg/configs": ^0.4.6
  "@lezer/generator": ^1.8.0
  "@lezer/highlight": ^1.2.3
  "@lezer/lr": ^1.4.10
  "@lumis-sh/lumis": ^0.6.1
  "@lumis-sh/themes": ^0.2.2
  "@playwright/test": ^1.62.1
  "@sveltejs/vite-plugin-svelte": ^7.3.0
  "@vitest/browser-playwright": ^4.1.11
  "@vitest/browser": ^4.1.11
  commander: ^15.0.0
  diff: ^9.0.0
  highlight.js: ^11.12.0
  jsonc: ^2.0.0
  playwright: ^1.62.1
  prismjs: ^1.30.0
  retrie: ^0.1.1
  shiki: ^4.4.3
  svelte-check: ^4.7.6
  svelte: ^5.56.10
  tree-sitter-nsis: ^0.4.0
  unplugin-macros: ^0.23.2
  vite: ^8.2.2
  vitest-browser-svelte: ^3.0.0
  vitest: ^4.1.11
