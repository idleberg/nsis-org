packages:
  - "packages/*"
  - "web"

allowBuilds:
  esbuild: false
  lefthook: false
  sharp: false

autoInstallPeers: true
injectWorkspacePackages: true
publicHoistPattern:
  - "*@biomejs/biome*"
  - "*@e18e/cli*"
  - "*@total-typescript/tsconfig*"

minimumReleaseAgeExclude:
  - "@nsis/dent"
  - "@idleberg/configs"
  - tree-sitter-nsis

catalog:
  "@codemirror/autocomplete": ^6.20.4
  "@codemirror/commands": ^6.11.1
  "@codemirror/language": ^6.13.1
  "@codemirror/state": ^6.7.6
  "@codemirror/theme-one-dark": ^6.1.3
  "@codemirror/view": ^6.43.15
  "@idleberg/configs": ^0.4.6
  "@lezer/generator": ^1.8.1
  "@lezer/highlight": ^1.2.5
  "@lezer/lr": ^1.4.11
  "@lumis-sh/lumis": ^0.7.1
  "@lumis-sh/themes": ^0.2.2
  "@playwright/test": ^1.64.1
  "@sveltejs/vite-plugin-svelte": ^7.3.1
  "@valibot/to-json-schema": ^1.8.0
  "@vitest/browser-playwright": ^5.0.5
  "@vitest/browser": ^5.0.5
  commander: ^15.0.0
  diff: ^9.0.0
  highlight.js: ^11.12.0
  jsonc: ^3.0.0
  playwright: ^1.64.1
  prismjs: ^1.30.0
  retrie: ^0.1.1
  shiki: ^4.5.0
  svelte-check: ^4.7.7
  svelte: ^5.57.2
  tree-sitter-nsis: ^0.4.1
  unplugin-macros: ^0.23.3
  valibot: ^1.5.0
  vite: ^8.3.4
  vitest-browser-svelte: ^3.1.0
  vitest: ^5.0.5
